[project]
name = "devpilot"
version = "0.1.0"
description = "Local-first code review and release quality assistant"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13,<1.16",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.29",
    "pydantic>=2.9,<2.11",
    "pydantic-settings>=2.6,<2.8",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn>=0.32,<0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
